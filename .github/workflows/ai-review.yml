name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write   # required for OIDC-based AWS auth

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure AWS credentials before calling the action.
      # Replace with your preferred auth method (OIDC, access keys, etc.).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run AI Review
        uses: ./review-harness   # use local copy; external repos use shiron-dev/ai-baton/review-harness@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
          agent: codex
          storage-backend: s3
          s3-bucket: ${{ secrets.REVIEW_HARNESS_S3_BUCKET }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  sync:
    runs-on: ubuntu-latest
    if: github.event.action == 'synchronize'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync human replies
        uses: ./review-harness
        with:
          pr-number: ${{ github.event.pull_request.number }}
          storage-backend: s3
          s3-bucket: ${{ secrets.REVIEW_HARNESS_S3_BUCKET }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
